name: Data collection (Poland and Czech Republic)
on:
  schedule:
    - cron: '23 0 * * *'   # every day 00:23 UTC, before the German rating update (02:47 UTC) copies these files
  workflow_dispatch:       # "Run workflow" button for manual runs
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Poland - tournaments
        continue-on-error: true
        env: {CS_COUNTRY: Poland, CS_FILE: data/cuescore_raw.json.gz}
        run: python3 -I collect_cuescore.py
      - name: Poland - team events
        continue-on-error: true
        env: {CS_COUNTRY: Poland, CS_TEAM_FILE: data/team_raw.json}
        run: python3 -I collect_team.py
      - name: Czech Republic - tournaments (added 6 Nov 2026; the first run reads everything since 2016)
        continue-on-error: true
        env: {CS_COUNTRY: Czech Republic, CS_FILE: data/cuescore_cze_raw.json.gz}
        run: python3 -I collect_cuescore.py
      - name: Czech Republic - team events
        continue-on-error: true
        env: {CS_COUNTRY: Czech Republic, CS_TEAM_FILE: data/team_cze_raw.json}
        run: python3 -I collect_team.py
      - name: Tournament Service - every country (added 7 Nov 2026; POL TOUR, Best of the East, EEBC)
        continue-on-error: true
        run: python3 -I collect_ts.py
      - name: Save new results
        if: always()
        run: |
          cat update_log.txt >> "$GITHUB_STEP_SUMMARY" || true
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add data
          git commit -m "Daily collection $(date +%Y-%m-%d)" || echo "No changes"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
