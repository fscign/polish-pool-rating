# Temporary test (7 Nov 2026): fetch the pages listed in probe_urls.txt from GitHub and save them to the branch probe-pages.
# Used to build the pzbil.pl collector. Delete after use.
name: pzbil.pl page test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir p; i=0
          while read -r u; do
            [ -z "$u" ] && continue; i=$((i+1))
            code=$(curl -s -L -m 60 -A "Mozilla/5.0 (pool rating collector, non-commercial)" -o "p/p$i.html" -w '%{http_code}' "$u")
            echo "$i $code $(wc -c < p/p$i.html) $u" | tee -a p/index.txt
            sleep 1
          done < probe_urls.txt
          cd p && git init -q && git checkout -q -b probe-pages && git add . && git -c user.name=rating-bot -c user.email=rating-bot@users.noreply.github.com commit -qm pages
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-pages
